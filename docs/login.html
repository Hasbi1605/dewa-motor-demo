<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Dewa Motor</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Auth CSS -->
    <!-- Vite Auth Assets -->
    <link rel="preload" as="style" href="build/assets/css/auth-BiAvy5-S.css" /><link rel="stylesheet" href="build/assets/css/auth-BiAvy5-S.css" /></head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-motorcycle"></i>
                </div>
                <h1>Login Admin</h1>
                <p>Masuk ke panel administrasi Dewa Motor</p>
            </div>

            <!-- Success Message -->
            
            <!-- Info Message -->
            
            <!-- Error Messages -->
            
            <form method="POST" action="login.html" id="loginForm">
                <input type="hidden" name="_token" value="28HzemDbFtyGDgirkpyc1JM3CK2PUxZF5DR7RkPa" autocomplete="off">                
                <div class="form-floating">
                    <input type="email" 
                           class="form-control " 
                           id="email" 
                           name="email" 
                           value="" 
                           placeholder="name@example.com" 
                           required>
                    <label for="email">
                        <i class="fas fa-envelope me-2"></i>
                        Email Address
                    </label>
                                    </div>

                <div class="form-floating position-relative">
                    <input type="password" 
                           class="form-control " 
                           id="password" 
                           name="password" 
                           placeholder="Password" 
                           required>
                    <label for="password">
                        <i class="fas fa-lock me-2"></i>
                        Password
                    </label>
                    <button type="button" class="btn btn-outline-secondary password-toggle" onclick="togglePassword('password')">
                        <i class="fas fa-eye" id="password-icon"></i>
                    </button>
                                    </div>

                <div class="form-check">
                    <input class="form-check-input" 
                           type="checkbox" 
                           name="remember" 
                           id="remember">
                    <label class="form-check-label" for="remember">
                        Ingat saya
                    </label>
                </div>

                <button type="submit" class="btn btn-login" id="loginBtn">
                    <span class="btn-text">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Masuk
                    </span>
                    <span class="btn-loading d-none">
                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        Memproses...
                    </span>
                </button>

                <a href="index.html" class="btn-back">
                    <i class="fas fa-arrow-left me-2"></i>
                    Kembali ke Store
                </a>

                <div class="text-center mt-3">
                    <small class="text-muted">
                        Belum punya akun? 
                        <a href="index.html" class="text-decoration-none" style="color: var(--primary-color); font-weight: 500;">
                            Daftar di sini
                        </a>
                    </small>
                </div>
            </form>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Alihkan visibilitas password
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoading = loginBtn.querySelector('.btn-loading');

            loginForm.addEventListener('submit', function() {
                // Tampilkan status loading
                loginBtn.disabled = true;
                btnText.classList.add('d-none');
                btnLoading.classList.remove('d-none');
            });

            // Isi otomatis kredensial demo dalam development
                            document.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                        document.getElementById('email').value = 'admin@dewamotor.com';
                        document.getElementById('password').value = 'password';
                        e.preventDefault();
                    }
                });
                    });
    </script>
<script src="demo.js"></script>
</body>
</html>
